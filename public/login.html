<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Kartu Absensi Magang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="image/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>

  <!-- ===== AUTH SCREEN ===== -->
  <div class="wrap auth-wrap" id="authScreen" style="display:none;">
    <header class="header">
      <p class="eyebrow">Kartu Absensi — Program Magang</p>
      <h1 class="title">90 Hari Kerja</h1>
      <p class="sub">Login atau buat akun dulu buat mulai mencatat kehadiran.</p>
    </header>

    <section class="auth-panel">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" type="button">Login</button>
        <button class="auth-tab" id="tabRegister" type="button">Daftar Akun</button>
      </div>

      <form class="auth-form" id="loginForm">
        <label>Username
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>Password
          <div class="pwd-wrapper">
            <input type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="eye-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </label>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -6px;">
          <button type="button" id="btnShowForgot" class="link-btn">Lupa Password?</button>
        </div>
        <button type="submit" class="auth-submit">Masuk</button>
      </form>

      <form class="auth-form" id="forgotPasswordForm" style="display:none;">
        <label>Username
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>Password Baru
          <div class="pwd-wrapper">
            <input type="password" name="new_password" autocomplete="new-password" minlength="6" required>
            <button type="button" class="eye-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </label>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -6px;">
          <button type="button" id="btnBackToLogin" class="link-btn">Kembali ke Login</button>
        </div>
        <button type="submit" class="auth-submit">Simpan Sandi Baru</button>
      </form>

      <form class="auth-form" id="registerForm" style="display:none;">
        <label>Username
          <input type="text" name="username" autocomplete="username" minlength="3" required>
        </label>
        <label>Password
          <div class="pwd-wrapper">
            <input type="password" id="regPasswordInput" name="password" autocomplete="new-password" minlength="6" required>
            <button type="button" class="eye-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
          <ul class="pwd-criteria" id="pwdCriteria">
            <li id="critLength">Mempunyai minimal 6 karakter</li>
            <li id="critNumber">Mengandung setidaknya 1 angka</li>
          </ul>
        </label>
        <label>Sistem Hari Kerja
          <select name="work_days" required>
            <option value="6">6 Hari Kerja (Senin - Sabtu)</option>
            <option value="5">5 Hari Kerja (Senin - Jumat)</option>
          </select>
        </label>
        <label>Tanggal Mulai Magang
          <input type="date" name="start_date" required>
        </label>
        <p class="auth-hint">Sistem kerja dan tanggal awal menentukan perhitungan jadwal libur kalendermu secara otomatis.</p>
        <button type="submit" class="auth-submit">Buat Akun</button>
      </form>

      <p class="auth-error" id="authError"></p>
    </section>
  </div>

<script src="login.js"></script>
</body>
</html>
